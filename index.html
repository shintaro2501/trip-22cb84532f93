async function unlock(pin){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct));}
function show(h){document.open();document.write(h);document.close();}

(async()=>{const p=localStorage.getItem("trip_k");if(p){try{show(await unlock(p));}catch(x){localStorage.removeItem("trip_k");}}})();
